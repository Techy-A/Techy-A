<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Aryan Awasthi: 2nd on a Kaggle public leaderboard, 15 AI models ranked, Pearson 0.909 on speech, 92% RAG faithfulness">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4f9c"/><stop offset=".55" stop-color="#2f7fcf"/><stop offset="1" stop-color="#6db8ec"/>
    </linearGradient>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".14" stop-color="#fff"/>
      <stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff"/>
      <stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mx"><rect width="1200" height="400" fill="url(#fx)"/></mask>
    <mask id="my"><rect width="1200" height="400" fill="url(#fy)"/></mask>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/><stop offset=".35" stop-color="#ffd45c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd45c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx=".4" cy=".4" r=".6">
      <stop offset="0" stop-color="#fff6c4"/><stop offset=".6" stop-color="#ffd54f"/><stop offset="1" stop-color="#ffb300"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="shadow" x="-5%" y="-30%" width="110%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2a55" flood-opacity=".45"/>
    </filter>
    <style>
      .hello { font: 700 16px 'JetBrains Mono', Consolas, monospace; fill: #ffe08a; letter-spacing: 3px; }
      .name  { font: 800 70px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .tag   { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e3f2ff; letter-spacing: 1.6px; }
      .line  { font: 500 18px 'JetBrains Mono', Consolas, monospace; fill: #ffffff; opacity: 0; }
      .l0 { animation: cyc 12s infinite 0s; } .l1 { animation: cyc 12s infinite 3s; }
      .l2 { animation: cyc 12s infinite 6s; } .l3 { animation: cyc 12s infinite 9s; }
      @media (prefers-reduced-motion: reduce) { .line { animation: none; } .l0 { opacity: 1; } }
      @keyframes cyc { 0% {opacity:0} 4% {opacity:1} 22% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      .big { font: 800 40px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffe08a; }
      .lab { font: 700 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .sub { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e3f2ff; }
    </style>
  </defs>
  <g mask="url(#mx)"><g mask="url(#my)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <!-- sun -->
    <g transform="translate(1100,62)">
      <circle r="120" fill="url(#sunglow)"/>
      <g fill="#ffe27a" fill-opacity=".85"><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(0)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(30)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(60)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(90)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(120)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(150)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(180)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(210)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(240)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(270)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(300)"/><rect x="-3" y="-92" width="6" height="26" rx="3" transform="rotate(330)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/></g>
      <circle r="46" fill="url(#sun)"/>
    </g>
    <!-- drifting clouds -->
    <g transform="translate(0,58)"><g><g fill="#ffffff" fill-opacity="0.85" filter="url(#soft)"><circle cx="32.0" cy="0.0" r="27.2"/><circle cx="68.0" cy="-17.6" r="35.2"/><circle cx="108.0" cy="-6.4" r="30.4"/><circle cx="136.0" cy="4.8" r="20.8"/><circle cx="12.0" cy="8.0" r="17.6"/><circle cx="88.0" cy="11.2" r="24.0"/><circle cx="48.0" cy="12.8" r="22.4"/></g><animateTransform attributeName="transform" type="translate" from="-260 0" to="1300 0" dur="70s" begin="-10s" repeatCount="indefinite"/></g></g><g transform="translate(0,40)"><g><g fill="#ffffff" fill-opacity="0.6" filter="url(#soft)"><circle cx="22.0" cy="0.0" r="18.7"/><circle cx="46.8" cy="-12.1" r="24.2"/><circle cx="74.2" cy="-4.4" r="20.9"/><circle cx="93.5" cy="3.3" r="14.3"/><circle cx="8.2" cy="5.5" r="12.1"/><circle cx="60.5" cy="7.7" r="16.5"/><circle cx="33.0" cy="8.8" r="15.4"/></g><animateTransform attributeName="transform" type="translate" from="-260 0" to="1300 0" dur="95s" begin="-60s" repeatCount="indefinite"/></g></g><g transform="translate(0,82)"><g><g fill="#ffffff" fill-opacity="0.7" filter="url(#soft)"><circle cx="26.0" cy="0.0" r="22.1"/><circle cx="55.2" cy="-14.3" r="28.6"/><circle cx="87.8" cy="-5.2" r="24.7"/><circle cx="110.5" cy="3.9" r="16.9"/><circle cx="9.8" cy="6.5" r="14.3"/><circle cx="71.5" cy="9.1" r="19.5"/><circle cx="39.0" cy="10.4" r="18.2"/></g><animateTransform attributeName="transform" type="translate" from="-260 0" to="1300 0" dur="85s" begin="-35s" repeatCount="indefinite"/></g></g><g transform="translate(0,418)"><g><g fill="#ffffff" fill-opacity="0.75" filter="url(#soft)"><circle cx="40.0" cy="0.0" r="34.0"/><circle cx="85.0" cy="-22.0" r="44.0"/><circle cx="135.0" cy="-8.0" r="38.0"/><circle cx="170.0" cy="6.0" r="26.0"/><circle cx="15.0" cy="10.0" r="22.0"/><circle cx="110.0" cy="14.0" r="30.0"/><circle cx="60.0" cy="16.0" r="28.0"/></g><animateTransform attributeName="transform" type="translate" from="-260 0" to="1300 0" dur="110s" begin="-20s" repeatCount="indefinite"/></g></g><g transform="translate(0,408)"><g><g fill="#ffffff" fill-opacity="0.55" filter="url(#soft)"><circle cx="28.0" cy="0.0" r="23.8"/><circle cx="59.5" cy="-15.4" r="30.8"/><circle cx="94.5" cy="-5.6" r="26.6"/><circle cx="119.0" cy="4.2" r="18.2"/><circle cx="10.5" cy="7.0" r="15.4"/><circle cx="77.0" cy="9.8" r="21.0"/><circle cx="42.0" cy="11.2" r="19.6"/></g><animateTransform attributeName="transform" type="translate" from="-260 0" to="1300 0" dur="90s" begin="-75s" repeatCount="indefinite"/></g></g>
  </g></g>
  <g filter="url(#shadow)">
    <text class="hello" x="62" y="140">HI, I AM</text>
    <text class="name" x="56" y="212">Aryan Awasthi</text>
    <text class="tag" x="62" y="248">DATA ANALYTICS / MACHINE LEARNING / STATISTICAL MODELING</text>
    <text x="62" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#ffe08a">$</text>
    <text class="line l0" x="84" y="292">ENC @ Thapar Institute of Engineering and Technology</text><text class="line l1" x="84" y="292">AI Research Intern @ Appy Pie (Pixazo)</text><text class="line l2" x="84" y="292">teaching models to hear grammar mistakes</text><text class="line l3" x="84" y="292">from SQL dashboards to PyTorch models</text>
  </g>
  <g>
  <rect x="700" y="128" width="216" height="112" rx="16" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
  <text x="720" y="182" class="big">2nd</text>
  <text x="720" y="207" class="lab">Kaggle public leaderboard</text>
  <text x="720" y="225" class="sub">SHL spoken grammar scoring</text>
</g><g>
  <rect x="932" y="128" width="216" height="112" rx="16" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
  <text x="952" y="182" class="big">15</text>
  <text x="952" y="207" class="lab">AI models ranked</text>
  <text x="952" y="225" class="sub">Elo + Bradley-Terry ratings</text>
</g><g>
  <rect x="700" y="256" width="216" height="112" rx="16" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
  <text x="720" y="310" class="big">0.909</text>
  <text x="720" y="335" class="lab">Pearson r on speech</text>
  <text x="720" y="353" class="sub">Whisper + WavLM + Voxtral</text>
</g><g>
  <rect x="932" y="256" width="216" height="112" rx="16" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".45"/>
  <text x="952" y="310" class="big">92%</text>
  <text x="952" y="335" class="lab">RAG faithfulness</text>
  <text x="952" y="353" class="sub">CollegeBot, QLoRA tuned</text>
</g>
</svg>